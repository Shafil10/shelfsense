# ShelfSense configuration, tuned for an 8 GB RAM, CPU-only laptop

extraction:
  sample_fps: 1            # frames sampled per second of video
  resize_width: 1280       # downscale wider frames to this width (never upscales)
  blur_max: 0.5            # blur effect score (0 sharp - 1 blurred) above this = dropped
                           # real fridge frames: 0.24-0.39, artificially blurred: 0.56-0.72
  hash_distance: 6         # perceptual-hash distance below this = duplicate, dropped

detection:
  model: yolov8n.pt        # nano model: small enough for CPU inference
  conf_threshold: 0.25
  img_size: 640            # general default; Sprint 4 shelf models use sku110k.img_size
  max_det: 1000            # Ultralytics default is 300; a packed shelf can hold more products

sku110k:                   # Sprint 4 baseline detector (src/detection/)
  archive: datasets/SKU110K_fixed.tar.gz
  raw_dir: datasets/SKU110K_fixed
  yolo_dir: datasets/sku110k_yolo
  n_train: 2000            # random subset of the ~8,200 training photos
  n_val: 500               # random subset of the validation photos, for mAP
  max_side: 1280           # photos are up to ~4000 px; shrink once so data loading is not the bottleneck
  img_size: 1024           # our frames are 576x1024, so 1024 keeps them at full detail
  epochs: 30
  batch: 2                 # 4 GB GPU at 1024 px: batch 4 reached 4.8 GB on dense images and spilled into
                           # shared memory (2.7x slower); batch 8 needs 7.5 GB. Ultralytics still
                           # accumulates gradients to 64 images per weight update (nbs)
  workers: 1               # each data-loader worker holds its own torch + CUDA (~1 GB commit) and validation
                           # uses twice as many; 2 grew the pagefile on the full C: drive
  patience: 10
  seed: 0

finetune:                  # Sprint 4 step 2: SKU-110K model fine-tuned on our corrected frames
  yolo_dir: datasets/shelfsense_yolo
  val_fraction: 0.15       # share of TRAIN videos held out for early stopping (test frames never used)
  epochs: 50
  patience: 15
  seed: 0

vlm:
  model: Qwen/Qwen2-VL-2B-Instruct   # small VLM, run on Colab/Kaggle GPU
  max_frames: 8            # keyframes per clip in video mode
  max_new_tokens: 256
  results_dir: data/results          # put the Kaggle vlm_results.jsonl here
  ground_truth: data/annotations/vlm_ground_truth.json

categories:                # product categories in scope
  - soaps_and_detergents
  - biscuits_and_snacks
  - beverages

kpis:
  - out_of_stock
  - share_of_shelf
  - planogram_compliance
  - price_tag_posm
