# ShelfSense configuration, tuned for an 8 GB RAM, CPU-only laptop

extraction:
  sample_fps: 1            # frames sampled per second of video
  resize_width: 1280       # downscale wider frames to this width (never upscales)
  blur_max: 0.5            # blur effect score (0 sharp - 1 blurred) above this = dropped
                           # real fridge frames: 0.24-0.39, artificially blurred: 0.56-0.72
  hash_distance: 6         # perceptual-hash distance below this = duplicate, dropped

detection:
  model: yolov8n.pt        # nano model: small enough for CPU inference
  conf_threshold: 0.25
  img_size: 640            # general default; Sprint 4 shelf models use sku110k.img_size
  max_det: 1000            # Ultralytics default is 300; a packed shelf can hold more products
  weights: runs/detect/sku110k_v8n_4k/weights/best.pt   # current best detector (4k SKU-110K images)
  nutricoco_weights: runs/detect/nutricoco/weights/best.pt  # used by the server once trained (train_nutricoco.py)
  count_conf: 0.30         # threshold for counting products: best count MAE on the 500 SKU-110K val images
                           # (count_compare tune: 0.30 for the 4k model, 0.35 for the 2k model; 0.25 overcounts)

report:                    # Sprint 5 audit report (src/report/audit.py)
  reuse_hash_distance: 4   # keyframe pHash distance <= this = same picture as in an earlier audit
  reuse_min_share: 0.5     # flag re-used footage if this share of keyframes match one earlier audit
  max_blur_gap_sec: 2.0    # warn if a longer stretch of the video is lost to blur
  orb_min_inliers: 40      # local-feature re-use check (src/report/reuse.py), set with scripts/eval_reuse.py:
  orb_max_reproj_px: 2.0   # copies (re-encoded, 10% crop, half size) correlate 0.994-1.0 after alignment;
  orb_min_ncc: 0.98        # honest re-filming of the same shelf reached 0.964 on single keyframes
  orb_candidates: 5        # local-feature check only on the earlier audits with the closest pHashes (speed):
  orb_max_phash_distance: 18  # 10% crops were 10-14 from their original (rank 1-2 of 124), unrelated videos >= 22

sku110k:                   # Sprint 4 baseline detector (src/detection/)
  archive: datasets/SKU110K_fixed.tar.gz
  raw_dir: datasets/SKU110K_fixed
  yolo_dir: datasets/sku110k_yolo
  n_train: 2000            # random subset of the ~8,200 training photos
  n_val: 500               # random subset of the validation photos, for mAP
  max_side: 1280           # photos are up to ~4000 px; shrink once so data loading is not the bottleneck
  img_size: 1024           # our frames are 576x1024, so 1024 keeps them at full detail
  epochs: 30
  batch: 2                 # 4 GB GPU at 1024 px: batch 4 reached 4.8 GB on dense images and spilled into
                           # shared memory (2.7x slower); batch 8 needs 7.5 GB. Ultralytics still
                           # accumulates gradients to 64 images per weight update (nbs)
  workers: 1               # each data-loader worker holds its own torch + CUDA (~1 GB commit) and validation
                           # uses twice as many; 2 grew the pagefile on the full C: drive
  patience: 10
  seed: 0

finetune:                  # Sprint 4 step 2: SKU-110K model fine-tuned on our corrected frames
  yolo_dir: datasets/shelfsense_yolo
  val_fraction: 0.15       # share of TRAIN videos held out for early stopping (test frames never used)
  epochs: 50
  patience: 15
  seed: 0

vlm:
  model: Qwen/Qwen2-VL-2B-Instruct   # small VLM, run on Colab/Kaggle GPU
  max_frames: 8            # keyframes per clip in video mode
  max_new_tokens: 256
  results_dir: data/results          # put the Kaggle vlm_results.jsonl here
  ground_truth: data/annotations/vlm_ground_truth.json

categories:                # product categories in scope
  - soaps_and_detergents
  - biscuits_and_snacks
  - beverages

assistant:                 # "Ask about this audit" (src/assistant/ask.py): free local model via Ollama
  url: http://localhost:11434
  model: gemma3:4b         # chosen by scripts/eval_assistant.py (all facts right, no invented data); see data/results/assistant_eval.json
  num_ctx: 8192            # audit data + question; a 30-keyframe audit is about 3k tokens
  max_tokens: 300          # stops repetition loops (a Bangla answer looped for 5 min without a cap)
  timeout_sec: 120

server:                    # mobile app back end (src/server/app.py): dashboard + video upload + audits + GPS
  port: 8000
  max_upload_mb: 300       # a 30 s phone video is about 10-60 MB
  device: cpu              # detector device; the GPU is left to the AI assistant (4 GB)
  location_ttl_sec: 600    # hide merchandiser positions older than this
  database: data/shelfsense.db

tracking:                  # delivery visits from GPS (src/server/db.py)
  utc_offset_hours: 6      # Bangladesh time: a "day" in reports runs from midnight to midnight local time
  geofence_radius_m: 80    # default circle around a shop; check-in when inside
  checkout_factor: 1.5     # check-out only when farther than radius x this (no flicker at the edge)
  min_visit_minutes: 2     # shorter stays are "passed by" (riding past a shop), not counted as visits
  gps_max_accuracy_m: 50   # worse fixes never change a visit and are not counted as distance
  min_step_m: 10           # smaller moves are GPS jitter, not travel
  max_speed_kmh: 90        # faster jumps between two fixes are GPS errors (motorcycle in Dhaka)
  video_max_distance_m: 200  # a fridge video filmed farther from its shop gets a warning...
  video_far_m: 1000          # ...and farther than this a critical flag (re-audit): probably another place
  video_max_age_hours: 6     # a video recorded longer before it was sent gets a warning (could be an old one)
  fuel:                    # PLACEHOLDERS: NutriCoco to set their real numbers
    km_per_litre: 40       # motorcycle
    price_per_litre_tk: 130

nutricoco_train:           # NutriCoco detector from NutriCoco's labelled photos (src/detection/train_nutricoco.py)
  epochs: 60
  patience: 15
  img_size: 1024           # cups in a whole-fridge photo are small; 1024 kept small products findable (SKU-110K)
  batch: 2                 # GTX 1650 4 GB at 1024 px (batch 4 spilled into shared memory)
  workers: 1               # each worker holds its own torch + CUDA: more grew the pagefile on C:
  count_conf: 0.30         # same as detection.count_conf until tuned on NutriCoco's validation photos
  seed: 0

business:                  # NutriCoco distribution records (src/server/business.py)
  restock_days: 2          # warn when a shop got no delivery for longer (chilled pudding sells fast); NutriCoco to confirm

kpis:
  - out_of_stock
  - share_of_shelf
  - planogram_compliance
  - price_tag_posm
