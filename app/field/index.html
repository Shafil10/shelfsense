<title>ShelfSense Field</title>
<style>
/* Field staff app: PIN login, GPS tracking with automatic shop check-in/out, fridge videos recorded live in the
   app (or chosen from the phone), an offline outbox for videos and GPS points, English / Bangla. */
:root { --bg: #050A13; --card: #0E192B; --line: rgba(130, 180, 255, .16); --fg: #E7F0FF; --muted: #8399B8;
  --accent: #2EE6FF; --on-accent: #02121A; --ok: #3CF0A8; --warn: #FFC24B; --bad: #FF5C7C; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #EDF2FA; --card: #FFFFFF; --line: rgba(30, 70, 140, .16); --fg: #0B1830;
  --muted: #50627E; --accent: #0090C4; --on-accent: #FFFFFF; --ok: #0E9A63; --warn: #B07000; --bad: #D6334F; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, "Segoe UI", "Noto Sans Bengali", "Nirmala UI", sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; }
header b { font-size: 1.1rem; } .grow { flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 1rem; }
.muted { color: var(--muted); font-size: .85rem; } p { margin: 0; }
button, .btn { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 12px;
  padding: 12px 14px; font-weight: 600; cursor: pointer; text-align: center; }
.small { padding: 6px 10px; font-size: .85rem; border-radius: 10px; }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .5; }
input, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; }
select option { background: var(--card); }
#pin { font-size: 1.6rem; letter-spacing: .5em; text-align: center; }
.row { display: flex; gap: 8px; align-items: center; } .row > * { flex: 1; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow: auto; font-size: .88rem; }
.log div, .item { padding: 8px 10px; border-radius: 10px; background: rgba(120, 180, 255, .06); }
.item { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.bar { height: 8px; border-radius: 99px; background: rgba(120, 180, 255, .12); overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; z-index: 20;
  background: var(--accent); color: var(--on-accent); padding: 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
img.ev { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.cam { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; }
.cam video { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
.cam .bar2 { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); color: #fff; }
.cam .rec { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: #FF3B5C; padding: 0; }
.cam .rec.on { border-radius: 18px; }
.cam .time { font: 600 1.1rem ui-monospace, monospace; min-width: 70px; }
.cam .hint { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; color: #fff; background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 10px; font-size: .85rem; }
[hidden] { display: none !important; }
</style>
</head>

    deliveriesN: "{n}টি ডেলিভারি", onBike: "আজ আমার মোটরসাইকেলে", nothingLoaded: "আজ কিছু তোলা হয়নি।",

    reasons: { expired: "মেয়াদ শেষ", damaged: "ভাঙা / লিক", not_chilled: "ঠান্ডা রাখা হয়নি", unsold: "বিক্রি হয়নি", wrong_product: "ভুল পণ্য", other: "অন্যান্য" } }
};
const VERDICT = { en: { ok: "ok", review: "review", "re-audit": "re-audit" }, bn: { ok: "ঠিক আছে", review: "যাচাই দরকার", "re-audit": "আবার অডিট" } };
let LANG = localStorage.getItem("ss_lang") === "bn" ? "bn" : "en";
const BN = "০১২৩৪৫৬৭৮৯";
const num = x => LANG === "bn" ? String(x).replace(/[0-9]/g, c => BN[c]) : String(x);
function t(k, v) { let s = TX[LANG][k] ?? TX.en[k] ?? k; for (const key in v || {}) s = s.split("{" + key + "}").join(v[key]); return s; }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { me: null, shops: [], tracking: false, watch: null, wake: null, fix: null, lastSent: 0, visitShop: null, log: [],
  outbox: { videos: 0, pings: 0, deliveries: 0 }, sending: null, mine: [], open: null, install: null,
  products: [], pos: [], orders: [], bike: null, dshop: null };

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts, headers: opts.body ? { "Content-Type": "application/json" } : {} });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { S.me = null; render(); }
  if (!r.ok) { const e = new Error(data.error || r.statusText); e.status = r.status; throw e; }
  return data;
}
function toast(text) {
  const el = $("toast"); el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4500);
  if (navigator.vibrate) navigator.vibrate(200);
  if ("Notification" in window && Notification.permission === "granted" && document.hidden) new Notification("ShelfSense", { body: text });
}
const shopName = id => (S.shops.find(s => s.id === id) || {}).name || "shop " + id;
const hhmm = t => num(new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
const today = () => new Date().toDateString();

/* ---------- outbox: videos and GPS points made without a connection (IndexedDB, survives closing the app) ---------- */
const DB = new Promise((ok, fail) => {
  const req = indexedDB.open("shelfsense", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("outbox", { keyPath: "id", autoIncrement: true });
  req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error);
});
async function box(mode, fn) {
  const db = await DB;
  return new Promise((ok, fail) => {
    const tx = db.transaction("outbox", mode), r = fn(tx.objectStore("outbox"));
    tx.oncomplete = () => ok(r && r.result); tx.onerror = () => fail(tx.error);
  });
}
const boxAdd = item => box("readwrite", s => s.add({ ...item, created: Date.now() }));
const boxAll = () => box("readonly", s => s.getAll());
const boxDel = id => box("readwrite", s => s.delete(id));
async function countOutbox() {
  const all = await boxAll().catch(() => []);
  S.outbox = { videos: all.filter(i => i.kind === "video").length, pings: all.filter(i => i.kind === "ping").length,
    deliveries: all.filter(i => i.kind === "delivery").length };
  refresh("outbox", outboxHtml());
}
/* Sends everything in the outbox, oldest first: GPS points before newer ones, then videos one at a time. */
async function flush() {
  if (flush.busy || !S.me) return;
  flush.busy = true;
  try {
    for (const item of (await boxAll()).sort((a, b) => a.id - b.id)) {
      if (item.kind === "ping") {
        try { handleEvents((await api("/api/locations", { method: "POST", body: JSON.stringify(item.data) })).events); }
        catch (e) { if (!e.status) break; }  // no connection: try again later; a refused point (e.g. too old) is dropped
        await boxDel(item.id);
      } else if (item.kind === "delivery") {
        try { await api("/api/deliveries", { method: "POST", body: JSON.stringify(item.data) }); toast(t("deliverySaved")); }
        catch (e) { if (!e.status) break; toast(e.message); }
        await boxDel(item.id); loadBike();
      } else {
        const r = await upload(item);
        if (r === "offline") break;
        await boxDel(item.id);
      }
    }
  } finally { flush.busy = false; S.sending = null; await countOutbox(); loadMine(); }
}
function upload(item) {
  return new Promise(ok => {
    const xhr = new XMLHttpRequest();  // fetch() cannot report upload progress
    xhr.open("POST", "/api/audits?" + new URLSearchParams(item.query));
    xhr.setRequestHeader("Content-Type", item.blob.type || "video/mp4");
    xhr.upload.onprogress = ev => { if (ev.lengthComputable) { S.sending = Math.round(ev.loaded / ev.total * 100); refresh("outbox", outboxHtml()); } };
    xhr.onload = () => {
      if (xhr.status === 202) { toast(t("sent")); return ok("sent"); }
      if (xhr.status === 401) return ok("offline");  // logged out: keep the video
      let err = {}; try { err = JSON.parse(xhr.responseText); } catch (e) { /* none */ }
      toast(err.error || "Upload refused (" + xhr.status + ")"); ok("refused");
    };
    xhr.onerror = () => ok("offline");
    xhr.send(item.blob);
  });
}
window.addEventListener("online", flush);
setInterval(() => { if (S.outbox.videos + S.outbox.pings + S.outbox.deliveries) flush(); }, 30000);

/* ---------- screens ---------- */
function render() {
  document.documentElement.lang = LANG;
  const langBtn = '<button class="small" id="lang">' + t("lang") + "</button>";
  if (!S.me) {
    $("app").innerHTML = '<header><b>' + t("title") + '</b><span class="grow"></span>' + langBtn + '</header><form class="card" id="loginForm"><h2>' + t("login") + "</h2>" +
      '<p class="muted">' + t("pinHint") + '</p><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>' +
      '<button class="primary" type="submit">' + t("login") + '</button><p class="muted" id="loginErr"></p></form>';
    return;
  }
  const opts = S.shops.map(s => '<option value="' + s.id + '"' + (s.id === S.visitShop ? " selected" : "") + ">" + esc(s.name) + "</option>").join("");
  const canRecord = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  $("app").innerHTML =
    '<header><b>' + esc(S.me.name) + '</b><span class="grow"></span>' + langBtn + '<button class="small" id="logout">' + t("logout") + "</button></header>" +
    (S.install ? '<button id="install">' + t("install") + "</button>" : "") +
    (isIos() && !standalone() ? '<p class="muted">' + t("iosInstall") + "</p>" : "") +
    (S.me.role !== "staff" ? '<section class="card"><h2>' + t("tracking") + '</h2><p class="muted">' + t("officeNote") + "</p></section>" :
      '<section class="card"><div class="row"><h2>' + t("tracking") + '</h2><span style="flex:0" class="chip ' + (S.tracking ? "ok" : "warn") + '">' + t(S.tracking ? "on" : "off") + "</span></div>" +
      '<p class="muted">' + t("trackHint") + '</p><button id="track" class="' + (S.tracking ? "danger" : "primary") + '">' + t(S.tracking ? "stop" : "start") + "</button>" +
      '<p class="muted" id="fix">' + fixText() + '</p><p id="here">' + hereText() + '</p><div class="log" id="log">' + logHtml() + "</div></section>") +
    '<section class="card"><h2>' + t("video") + '</h2><p class="muted">' + t("videoHint") + "</p>" +
    '<select id="shop">' + opts + "</select>" +
    (canRecord ? '<button class="primary" id="record">' + t("recordApp") + "</button>" : "") +
    '<label class="btn' + (canRecord ? "" : " primary") + '" for="vid">' + t("chooseFile") + '</label><input id="vid" type="file" accept="video/*" capture="environment" hidden></section>' +
    (S.me.role === "staff" && S.products.length ? deliveryHtml() : "") +
    '<div id="outbox">' + outboxHtml() + "</div>" +
    '<section class="card"><h2>' + t("mine") + '</h2><div id="mine" class="log" style="max-height:none">' + mineHtml() + "</div></section>";
}
function fixText() {
  if (!S.fix) return S.tracking ? t("waitGps") : "";
  return "GPS " + num(S.fix.lat.toFixed(5)) + ", " + num(S.fix.lon.toFixed(5)) + " (±" + num(Math.round(S.fix.acc)) + " m) · " + hhmm(S.fix.t);
}
function hereText() { return S.visitShop ? '<span class="chip ok">' + esc(t("at", { s: shopName(S.visitShop) })) + "</span>" : ""; }
function logHtml() { return S.log.map(l => "<div>" + esc(l) + "</div>").join(""); }
/* Delivery at a shop: delivered and taken-back quantities per product, optionally for a Pandamart PO or a
   reseller order of that shop; plus what is still on the motorcycle today. */
function deliveryHtml() {
  const shop = S.dshop ?? S.visitShop ?? S.shops[0]?.id;
  const refs = S.pos.filter(p => p.shop_id === shop).map(p => '<option value="po:' + p.id + '">' + esc(t("po", { n: p.number })) + "</option>")
    .concat(S.orders.filter(o => o.shop_id === shop).map(o => '<option value="order:' + o.id + '">' + esc(t("order", { n: num(o.id), s: o.status })) + "</option>"));
  const reasons = Object.entries(TX[LANG].reasons).map(([k, v]) => '<option value="' + k + '">' + esc(v) + "</option>").join("");
  const rows = S.products.map(p => '<div class="row" style="flex-wrap:wrap"><b style="flex-basis:100%">' + esc(p.name) + "</b>" +
    '<label class="muted">' + t("delivered") + '<input type="number" min="0" inputmode="numeric" name="d' + p.id + '"></label>' +
    '<label class="muted">' + t("returned") + '<input type="number" min="0" inputmode="numeric" name="r' + p.id + '"></label>' +
    '<label class="muted">' + t("reason") + '<select name="w' + p.id + '">' + reasons + "</select></label></div>").join("");
  const bike = S.bike?.items?.filter(i => i.loaded || i.delivered) || [];
  return '<form class="card" id="deliveryForm"><h2>' + t("delivery") + '</h2><p class="muted">' + t("deliveryHint") + "</p>" +
    '<select id="dshop">' + S.shops.map(s => '<option value="' + s.id + '"' + (s.id === shop ? " selected" : "") + ">" + esc(s.name) + "</option>").join("") + "</select>" +
    (refs.length ? '<label class="muted">' + t("against") + '<select name="ref"><option value="">' + t("noRef") + "</option>" + refs.join("") + "</select></label>" : "") +
    rows + '<button class="primary" type="submit">' + t("saveDelivery") + "</button>" +
    '<h2 style="margin-top:6px">' + t("onBike") + "</h2>" + (bike.length ? bike.map(i => "<p>" + esc(i.name) + ': <b>' +
      t("loadedLeft", { l: num(i.loaded), d: num(i.delivered), r: num(i.on_bike) }) + "</b></p>").join("") : '<p class="muted">' + t("nothingLoaded") + "</p>") + "</form>";
}
async function loadBike() {
  if (S.me?.role !== "staff") return;
  try { S.bike = await api("/api/my-stock"); } catch (e) { /* offline */ }
}
async function saveDelivery(form) {
  const f = new FormData(form), shop = +$("dshop").value, ref = f.get("ref") || "";
  const items = S.products.map(p => ({ product_id: p.id, delivered: +f.get("d" + p.id) || 0, returned: +f.get("r" + p.id) || 0, return_reason: f.get("w" + p.id) }))
    .filter(i => i.delivered || i.returned);
  if (!items.length) return;
  const data = { shop_id: shop, items, t: new Date().toISOString(),
    po_id: ref.startsWith("po:") ? +ref.slice(3) : null, order_id: ref.startsWith("order:") ? +ref.slice(6) : null };
  try { await api("/api/deliveries", { method: "POST", body: JSON.stringify(data) }); toast(t("deliverySaved")); }
  catch (e) {
    if (e.status) return toast(e.message);
    await boxAdd({ kind: "delivery", data }); await countOutbox(); toast(t("deliveryQueued"));
  }
  form.reset(); await loadBike(); render();
}
function outboxHtml() {
  const { videos, pings, deliveries } = S.outbox;
  if (!videos && !pings && !deliveries && S.sending === null) return "";
  const parts = [videos && t("videosN", { n: num(videos) }), deliveries && t("deliveriesN", { n: num(deliveries) }),
    pings && t("pointsN", { n: num(pings) })].filter(Boolean).join(" · ");
  return '<section class="card"><div class="row"><h2>' + t("outbox") + '</h2><button class="small" style="flex:0" id="flush">' + t("sendNow") + "</button></div>" +
    "<p>" + parts + "</p>" + (S.sending !== null ? '<div class="bar"><i style="width:' + S.sending + '%"></i></div><p class="muted">' + t("uploading", { p: num(S.sending) }) + "</p>"
      : '<p class="muted">' + t("outboxHint") + "</p>") + "</section>";
}
function mineHtml() {
  if (!S.mine.length) return '<p class="muted">' + t("none") + "</p>";
  return S.mine.map(m => {
    const v = m.status === "done" ? m.verdict : null, cls = { ok: "ok", review: "warn", "re-audit": "bad" }[v] || "";
    const label = v ? VERDICT[LANG][v] || v : t({ queued: "queued", processing: "processing", failed: "failed" }[m.status] || "queued");
    let body = "";
    if (S.open === m.id && m.report) {
      const r = m.report, kf = r.keyframes.reduce((b, k) => (!b || k.products > b.products ? k : b), null), c = r.capture || {};
      const ag = r.kpis?.agreement;
      body = "<p>" + t("frames", { k: num(r.summary.keyframes), p: num(r.summary.products_per_keyframe.max) }) + "</p>" +
        (ag?.status === "measured" ? '<p class="' + ({ compliant: "ok", violation: "bad", unclear: "warn" }[ag.result]) + '">' +
          t("cupsSeen", { a: num(ag.cups_visible), b: num(ag.agreed_cups) }) + "</p>" : "") +
        (c.distance_to_shop_m != null ? '<p class="muted">' + t("distance", { m: num(c.distance_to_shop_m) }) + "</p>" : "") +
        r.integrity.flags.map(f => '<p class="' + (f.severity === "critical" ? "bad" : "warn") + '">' + esc(f.detail) + "</p>").join("") +
        (kf ? '<img class="ev" alt="" src="/reports/' + encodeURIComponent(m.video.replace(/\.[^.]+$/, "")) + "/" + kf.evidence + '">' : "");
    }
    return '<div class="item" data-open="' + esc(m.id) + '"><div class="row"><span>' + esc(m.shop) + ' <span class="muted">' + hhmm(m.received_utc) + " · " +
      t(m.source === "in_app" ? "live" : "file") + '</span></span><span style="flex:0" class="chip ' + cls + '">' + esc(label) + "</span></div>" + body + "</div>";
  }).join("");
}
function refresh(id, html) { const el = $(id); if (el) el.innerHTML = html; }
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;

/* ---------- my videos: today's uploads and their results (refreshed while any is still being checked) ---------- */
async function loadMine() {
  if (!S.me) return;
  try {
    const list = (await api("/api/audits")).filter(m => new Date(m.received_utc).toDateString() === today()).slice(0, 8);
    for (const m of list) if (m.status === "done" && S.open === m.id && !m.report) m.report = (await api("/api/audits/" + m.id)).report;
    S.mine = list; refresh("mine", mineHtml());
    clearTimeout(loadMine.t);
    if (list.some(m => m.status === "queued" || m.status === "processing")) loadMine.t = setTimeout(loadMine, 3000);
  } catch (e) { /* offline: keep the old list */ }
}

/* ---------- GPS tracking: one point every 15 s or after 30 m; points made offline go to the outbox ---------- */
async function startTracking() {
  if (!navigator.geolocation) return toast(t("noGps"));
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  try { S.wake = await navigator.wakeLock?.request("screen"); } catch (e) { /* not supported */ }
  S.tracking = true;
  S.watch = navigator.geolocation.watchPosition(onFix, err => toast("GPS: " + err.message), { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  render();
}
function stopTracking() {
  if (S.watch !== null) navigator.geolocation.clearWatch(S.watch);
  S.watch = null; S.tracking = false; S.wake?.release?.(); S.wake = null;
  render();
}
async function onFix(p) {
  const fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
  const moved = S.fix ? distM(S.fix, fix) : Infinity;
  S.fix = fix; refresh("fix", fixText());
  if (Date.now() - S.lastSent < 15000 && moved < 30) return;
  S.lastSent = Date.now();
  const data = { lat: fix.lat, lon: fix.lon, acc: fix.acc, t: new Date(fix.t).toISOString() };
  if (S.outbox.pings || S.outbox.videos || !navigator.onLine) { await boxAdd({ kind: "ping", data }); await countOutbox(); return flush(); }
  try {
    const r = await api("/api/locations", { method: "POST", body: JSON.stringify(data) });
    handleEvents(r.events);
    if (!r.events.length && r.visit_shop_id !== S.visitShop) { S.visitShop = r.visit_shop_id; S.dshop = null; render(); }
  } catch (e) { if (!e.status) { await boxAdd({ kind: "ping", data }); countOutbox(); } }
}
function handleEvents(events) {
  for (const ev of events || []) {
    const name = shopName(ev.shop_id);
    if (ev.kind === "check_in") { S.visitShop = ev.shop_id; S.log.unshift(t("logIn", { t: hhmm(ev.t), s: name })); toast(t("checkedIn", { s: name })); }
    else { if (S.visitShop === ev.shop_id) S.visitShop = null; S.log.unshift(t("logOut", { t: hhmm(ev.t), s: name })); toast(t("checkedOut", { s: name })); }
  }
  if (events && events.length) { S.dshop = null; render(); }  // the video and delivery forms follow the shop the rider is at
}
function distM(a, b) {
  const k = Math.PI / 180, h = Math.sin((b.lat - a.lat) * k / 2) ** 2 + Math.cos(a.lat * k) * Math.cos(b.lat * k) * Math.sin((b.lon - a.lon) * k / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
document.addEventListener("visibilitychange", async () => {  // the screen lock releases the wake lock: take it again
  if (document.visibilityState !== "visible") return;
  if (S.tracking) { try { S.wake = await navigator.wakeLock?.request("screen"); } catch (e) { /* ignore */ } }
  flush(); loadMine();
});

/* ---------- fridge videos: every video goes through the outbox, so nothing is lost without a connection ---------- */
async function queueVideo(blob, source, captured) {
  if (blob.size > 300e6) return toast(t("tooBig"));
  const shop = +$("shop").value;
  const query = { shop: shopName(shop), shop_id: shop, source, captured: new Date(captured).toISOString() };
  if (S.fix && Date.now() - S.fix.t < 120000) Object.assign(query, { lat: S.fix.lat, lon: S.fix.lon, acc: S.fix.acc });
  else {  // not tracking: take one fresh position for this video
    // our own 8 s limit: the browser's timeout only starts after the rider answers the permission question
    const p = await new Promise(ok => {
      setTimeout(() => ok(null), 8000);
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(ok, () => ok(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
      else ok(null);
    });
    if (p) Object.assign(query, { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy });
  }
  await boxAdd({ kind: "video", blob, query });
  await countOutbox();
  if (!navigator.onLine) toast(t("savedOffline"));
  flush();
}
document.addEventListener("change", e => {
  if (e.target.id === "vid" && e.target.files[0]) { const f = e.target.files[0]; queueVideo(f, "file", f.lastModified || Date.now()); e.target.value = ""; }
});

/* In-app camera: live recording only (no gallery), 720p to keep files small (about 5-10 MB for 30 s). */
async function openCamera() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (e) { return toast(t("camFail", { e: e.message })); }
  const type = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  $("camera").innerHTML = '<div class="cam"><video id="preview" autoplay playsinline muted></video><div class="hint">' + t("camHint") +
    '</div><div class="bar2"><button id="camCancel" style="color:#fff">' + t("cancel") + '</button><button class="rec" id="recBtn" aria-label="Record"></button><span class="time" id="recTime">' + num("0:00") + "</span></div></div>";
  $("preview").srcObject = stream;
  let rec = null, chunks = [], started = 0, timer = null;
  const close = () => { clearInterval(timer); stream.getTracks().forEach(tr => tr.stop()); $("camera").innerHTML = ""; };
  $("camCancel").onclick = () => { if (rec && rec.state === "recording") { rec.onstop = null; rec.stop(); } close(); };
  $("recBtn").onclick = () => {
    if (rec && rec.state === "recording") return rec.stop();
    chunks = []; rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 2_500_000 } : { videoBitsPerSecond: 2_500_000 });
    rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    rec.onstop = () => { const blob = new Blob(chunks, { type: (rec.mimeType || type || "video/webm").split(";")[0] }); close(); queueVideo(blob, "in_app", started); };
    rec.start(1000); started = Date.now(); $("recBtn").classList.add("on");
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      $("recTime").textContent = num(Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"));
      if (s >= 60) rec.stop();  // one minute is plenty for a fridge
    }, 250);
  };
}

/* ---------- events ---------- */
document.addEventListener("change", e => { if (e.target.id === "dshop") { S.dshop = +e.target.value; render(); } });
document.addEventListener("submit", async e => {
  if (e.target.id === "deliveryForm") { e.preventDefault(); return saveDelivery(e.target); }
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  try { S.me = await api("/api/login", { method: "POST", body: JSON.stringify({ pin: $("pin").value }) }); await start(); }
  catch (err) { $("loginErr").textContent = err.message; }
});
document.addEventListener("click", async e => {
  const el = e.target.closest("button, .item"); if (!el) return;
  if (el.id === "track") S.tracking ? stopTracking() : startTracking();
  if (el.id === "record") openCamera();
  if (el.id === "flush") flush();
  if (el.id === "lang") { LANG = LANG === "en" ? "bn" : "en"; localStorage.setItem("ss_lang", LANG); render(); }
  if (el.id === "install" && S.install) { S.install.prompt(); S.install = null; render(); }
  if (el.id === "logout") {
    stopTracking(); await api("/api/logout", { method: "POST", body: "{}" }).catch(() => {});
    S.me = null; localStorage.removeItem("ss_me"); render();
  }
  if (el.dataset.open) { S.open = S.open === el.dataset.open ? null : el.dataset.open; await loadMine(); }
});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.install = e; if (S.me) render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/field/sw.js", { scope: "/field/" }).catch(() => {});

/* The rider's name and the shop list are kept on the phone, so the app also opens without a connection
   (the session itself is an HttpOnly cookie the page cannot read). */
async function start() {
  if (S.me.visit_shop_id) S.visitShop = S.me.visit_shop_id;  // already checked in somewhere (app was closed)
  localStorage.setItem("ss_me", JSON.stringify(S.me));
  try { S.shops = await api("/api/shops"); localStorage.setItem("ss_shops", JSON.stringify(S.shops)); }
  catch (e) { if (e.status) throw e; S.shops = JSON.parse(localStorage.getItem("ss_shops") || "[]"); }
  if (S.me.role === "staff") {
    try {
      [S.products, S.pos, S.orders] = await Promise.all([api("/api/products"), api("/api/pos"), api("/api/orders")]);
      localStorage.setItem("ss_products", JSON.stringify(S.products));
      await loadBike();
    } catch (e) { S.products = JSON.parse(localStorage.getItem("ss_products") || "[]"); }
  }
  render(); await countOutbox(); flush(); loadMine();
}
(async () => {
  try { S.me = await api("/api/me"); await start(); }
  catch (e) {
    const cached = localStorage.getItem("ss_me");
    if (!e.status && cached) { S.me = JSON.parse(cached); await start(); }  // offline: work from the outbox
    else render();
  }
})();
</script>
