<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>ShelfSense Audit Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout: a demo control strip, then the app itself. Wide screens get a side nav; narrow screens (or the phone preview) get a bottom tab bar. */
:root {
  --bg: #EEF1F0;
  --surface: #FFFFFF;
  --surface-2: #E4E9E7;
  --line: #CFD8D5;
  --fg: #15201C;
  --muted: #5A6A65;
  --accent: #2742A8;
  --accent-soft: #E3E8F8;
  --on-accent: #FFFFFF;
  --ok: #1E7A4C;
  --ok-soft: #DFF1E7;
  --warn: #A86A12;
  --warn-soft: #F8ECD6;
  --bad: #C0342A;
  --bad-soft: #F8E1DE;
  --fridge-in: #E6EEF3;
  --device: #1B2420;
  --font-display: "Archivo", "Noto Sans Bengali", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans Bengali", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #151D1A; --surface-2: #1D2824; --line: #2C3934; --fg: #E5EDEA; --muted: #95A59F;
    --accent: #8FA3FF; --accent-soft: #232C52; --on-accent: #0E1412;
    --ok: #4FC48C; --ok-soft: #173326; --warn: #E2AA4E; --warn-soft: #3A2C14; --bad: #F2766B; --bad-soft: #3D1C19;
    --fridge-in: #1A2630; --device: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #151D1A; --surface-2: #1D2824; --line: #2C3934; --fg: #E5EDEA; --muted: #95A59F;
  --accent: #8FA3FF; --accent-soft: #232C52; --on-accent: #0E1412;
  --ok: #4FC48C; --ok-soft: #173326; --warn: #E2AA4E; --warn-soft: #3A2C14; --bad: #F2766B; --bad-soft: #3D1C19;
  --fridge-in: #1A2630; --device: #000000; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
html[lang="bn"] body { font-family: "Noto Sans Bengali", "IBM Plex Sans", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 0.95rem; font-weight: 700; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.8rem; }
.eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* demo strip */
.demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.8rem;
}
.demo .tag { font-family: var(--font-mono); font-weight: 500; color: var(--warn); }
.demo .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 0.8rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.stage { display: flex; justify-content: center; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { width: 100%; max-width: 1280px; container-type: inline-size; container-name: app; background: var(--bg); }
.stage.phone .app { width: 390px; max-width: 100%; height: 800px; max-height: 85vh; overflow-y: auto; border: 10px solid var(--device); border-radius: 38px; }

/* app header */
.apphead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stage.phone .apphead { border-radius: 0; border-width: 0 0 1px 0; position: sticky; top: 0; z-index: 5; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.logo svg { width: 26px; height: 26px; }
.apphead .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.plain { background: transparent; border: 1px solid var(--line); }
select.inp, input.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 0; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.good { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* frame */
.body { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; align-self: start; }
.side button { text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.side button svg, .tabbar button svg { width: 18px; height: 18px; flex: none; }
.side button:hover { background: var(--surface-2); }
.side button[aria-current="page"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.side .role { padding: 4px 12px 10px; }
main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.tabbar { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-ev { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.pagehead p { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.75rem; color: var(--muted); }
.kpi.alert { border-color: var(--warn); background: var(--warn-soft); }
.kpi.alert .v { color: var(--warn); }
.kpi button { all: unset; cursor: pointer; font-size: 0.75rem; color: var(--accent); font-weight: 600; }

.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.rival > i { background: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bars .row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 0.82rem; }

svg.chart { width: 100%; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-mono); }
svg.chart .line { stroke: var(--accent); stroke-width: 2.5; fill: none; }
svg.chart .area { fill: var(--accent); opacity: 0.12; }
svg.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
svg.chart .val { fill: var(--fg); font-size: 12px; font-weight: 600; font-family: var(--font-mono); }

/* fridge evidence */
svg.fridge { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }
.fr-body { fill: var(--surface-2); stroke: var(--line); stroke-width: 2; }
.fr-in { fill: var(--fridge-in); }
.fr-shelf { stroke: var(--line); stroke-width: 3; }
.fr-gap { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; stroke-width: 1.5; }
.fr-dim { fill: var(--surface); opacity: 0.62; }
.fr-num { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.fr-hatch { fill: var(--surface-2); }
.fr-nf { fill: var(--muted); font-size: 13px; font-weight: 600; }
.box { fill: none; stroke-width: 2.5; }
.box.bad { stroke: var(--bad); } .box.warn { stroke: var(--warn); stroke-dasharray: 6 3; } .box.off { stroke: var(--muted); stroke-dasharray: 2 3; }
.box.sel { stroke-width: 4; }
.boxlbl { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.boxlbl.bad { fill: var(--bad); } .boxlbl.warn { fill: var(--warn); } .boxlbl.off { fill: var(--muted); }
.framestrip { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.framestrip button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; font-family: var(--font-mono); font-size: 0.75rem; }
.framestrip button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.finding { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; }
.finding .stripe { border-radius: 2px; background: var(--line); }
.finding.bad .stripe { background: var(--bad); } .finding.warn .stripe { background: var(--warn); } .finding.ok .stripe { background: var(--ok); }
.finding .t { font-weight: 600; cursor: pointer; }
.finding .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 0.78rem; color: var(--muted); }
.finding .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.finding.selected .t { color: var(--accent); }

.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 0.8rem; min-width: 0; }
.check .ic { font-weight: 700; flex: none; width: 16px; text-align: center; }
.check.ok .ic { color: var(--ok); } .check.bad { background: var(--bad-soft); } .check.bad .ic { color: var(--bad); } .check.plan .ic { color: var(--muted); }
.check .mono { word-break: break-all; font-size: 0.7rem; color: var(--muted); display: block; }

/* the audit stamp */
.stampwrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.stamp { font-family: var(--font-mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; font-size: 1rem; padding: 8px 16px; border: 3px double currentColor; border-radius: 6px; transform: rotate(-3deg); display: inline-block; }
html[lang="bn"] .stamp { letter-spacing: 0.02em; font-family: "Noto Sans Bengali", var(--font-mono); font-weight: 700; }
.stamp.pay { color: var(--ok); } .stamp.hold { color: var(--bad); } .stamp.reaudit { color: var(--warn); } .stamp.pending { color: var(--muted); }
.decide { display: flex; flex-wrap: wrap; gap: 8px; }
.decide button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* merchandiser */
.route { display: flex; flex-direction: column; }
.route .stop { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.route .stop:last-child { border-bottom: 0; }
.route .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; background: var(--surface-2); }
.route .stop.done .n { background: var(--ok-soft); color: var(--ok); }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.has { border-color: var(--ok); border-style: solid; background: var(--ok-soft); }
.drop .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.ck { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
.ck input { width: 18px; height: 18px; accent-color: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.steps .s { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.steps .s.done { color: var(--fg); } .steps .s.done .ic { color: var(--ok); }
.steps .s.now { color: var(--accent); font-weight: 600; }
.steps .ic { width: 18px; text-align: center; font-weight: 700; }
.result { border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.result.ok { background: var(--ok-soft); } .result.bad { background: var(--bad-soft); }
.result .big { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }
.result.ok .big { color: var(--ok); } .result.bad .big { color: var(--bad); }
.score { font-family: var(--font-display); font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
.switch { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch p { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; max-width: 60ch; }
.toggle { position: relative; width: 42px; height: 24px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; inset: 0; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 12px; background: var(--line); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.log { display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
.log div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; }

/* login */
.login { max-width: 860px; margin: 24px auto; display: flex; flex-direction: column; gap: 20px; }
.login .hero { display: flex; flex-direction: column; gap: 8px; }
.login .hero h1 { font-size: 2.3rem; }
.login .hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1rem; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rolecard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rolecard:hover { border-color: var(--accent); }
.rolecard .who { font-size: 0.8rem; color: var(--muted); }
.rolecard .go { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin-top: auto; }
.rolecard svg { width: 28px; height: 28px; color: var(--accent); }
.login .opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(10, 15, 13, 0.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .box2 { background: var(--surface); border-radius: 12px; width: min(720px, 100%); max-height: 85vh; display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal pre { margin: 0; padding: 16px; overflow: auto; font-family: var(--font-mono); font-size: 0.75rem; white-space: pre; }

.empty { padding: 24px; text-align: center; color: var(--muted); }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 0.82rem; }

/* narrow: app container below 760px */
@container app (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
  .side { display: none; }
  .tabbar {
    display: flex; position: sticky; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); margin-top: 16px;
  }
  .tabbar button { flex: 1; border: 0; background: transparent; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.68rem; color: var(--muted); min-width: 0; }
  .tabbar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .kpi:first-child { grid-column: 1 / -1; }
  .grid2, .grid-ev { grid-template-columns: minmax(0, 1fr); }
  .roles { grid-template-columns: minmax(0, 1fr); }
  .login .hero h1 { font-size: 1.8rem; }
  .apphead .who-name { display: none; }
  .hide-narrow { display: none; }
}
.stage.phone main { padding: 0 12px; }
.stage.phone .login { padding: 0 12px; margin-top: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="demo" id="demo"></div>
<div class="stage" id="stage"><div class="app" id="app"></div></div>
<div id="modal"></div>

<script>
(function () {
"use strict";

/* ---------- reference data ---------- */
const BRAND = {
  "Coca-Cola": { c: "#D7262E", owner: "coke" }, "Sprite": { c: "#2E9B4E", owner: "coke" }, "Fanta": { c: "#F28C1B", owner: "coke" }, "Kinley": { c: "#6FB7E0", owner: "coke" },
  "Pepsi": { c: "#1F4FB8", owner: "transcom" }, "7Up": { c: "#3DAF5B", owner: "transcom" }, "Mirinda": { c: "#F07A1F", owner: "transcom" }, "Mountain Dew": { c: "#9CC63B", owner: "transcom" },
  "Mojo": { c: "#7A1F1F", owner: "akij" }, "Clemon": { c: "#E6C229", owner: "akij" }, "Speed": { c: "#2B2B3A", owner: "akij" },
  "Pran Up": { c: "#58B04A", owner: "pran" }, "Frutika": { c: "#E99A2C", owner: "pran" }, "Pran Cola": { c: "#8E2430", owner: "pran" }
};
const COMPANIES = [

  if (s.integ.coverage < 4) return '<span class="chip warn">' + d(s.integ.coverage) + "/" + d(4) + (S.lang === "bn" ? " তাক" : " shelves") + "</span>";
  return '<span class="chip ok">' + t("ok") + "</span>";
}
function fTime(f) { const fr = FRAMES.find(x => x.shelf === f.shelf); return fr ? fr.t : "—"; }

function fridgeSVG(shop, opt) {
  const co = curCo(); const main = co.brands[0]; const mc = (BRAND[main] || { c: "#666" }).c;
  const frames = FRAMES.slice(0, shop.integ.coverage);
  const curShelf = opt.frame != null && frames[opt.frame] ? frames[opt.frame].shelf : null;
  let s = '<svg class="fridge" viewBox="0 0 300 460" role="img" aria-label="' + esc(L(shop) + " · " + shop.fridge) + '">';
  s += '<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="fr-hatch"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--line)" stroke-width="3"/></pattern></defs>';
  s += '<rect x="6" y="6" width="288" height="448" rx="14" class="fr-body"/>';
  s += '<path d="M20 6h260a14 14 0 0 1 14 14v30H6V20A14 14 0 0 1 20 6z" fill="' + mc + '"/>';
  s += '<text x="150" y="35" text-anchor="middle" fill="#fff" font-family="Archivo, sans-serif" font-weight="800" font-size="17" letter-spacing="2">' + esc(main.toUpperCase()) + "</text>";
  s += '<rect x="26" y="58" width="256" height="360" rx="6" class="fr-in"/>';
  for (let sh = 0; sh < 4; sh++) {
    const y0 = 62 + sh * 89;
    s += '<text x="16" y="' + (y0 + 48) + '" text-anchor="middle" class="fr-num">' + d(sh + 1) + "</text>";
    const filmed = sh < shop.integ.coverage;
    if (!filmed) {
      s += '<rect x="30" y="' + (y0 + 2) + '" width="248" height="80" rx="4" fill="url(#hatch)"/>';
      s += '<text x="154" y="' + (y0 + 47) + '" text-anchor="middle" class="fr-nf">' + esc(t("notFilmed")) + "</text>";
    } else {
      for (let k = 0; k < 6; k++) {
        const x = 36 + k * 41, b = shop.slots[sh][k];
        if (!b) { s += '<rect x="' + x + '" y="' + (y0 + 14) + '" width="30" height="66" rx="5" class="fr-gap"/>'; continue; }
        const c = (BRAND[b] || { c: "#888" }).c;
        s += '<rect x="' + (x + 11) + '" y="' + (y0 + 6) + '" width="8" height="5" rx="1" fill="#2a2a2a"/>';
        s += '<path d="M' + (x + 11) + " " + (y0 + 11) + "h8l4 9v0H" + (x + 7) + 'z" fill="' + c + '"/>';
        s += '<rect x="' + x + '" y="' + (y0 + 19) + '" width="30" height="61" rx="6" fill="' + c + '"/>';
        s += '<rect x="' + x + '" y="' + (y0 + 40) + '" width="30" height="13" fill="#fff" opacity=".82"/>';
        s += '<text x="' + (x + 15) + '" y="' + (y0 + 50) + '" text-anchor="middle" font-size="7" font-family="Archivo, sans-serif" font-weight="700" fill="' + c + '">' + esc(b.split(" ")[0].slice(0, 6).toUpperCase()) + "</text>";
      }
    }
    s += '<line x1="26" x2="282" y1="' + (y0 + 84) + '" y2="' + (y0 + 84) + '" class="fr-shelf"/>';
    if (curShelf !== null && curShelf !== sh) s += '<rect x="26" y="' + y0 + '" width="256" height="86" class="fr-dim"/>';
  }
  shop.f.forEach(f => {
    if (f.shelf === null || !f.slot.length) return;
    const st = fStatus(shop, f);
    const cls = st === "overturned" ? "off" : st === "review" ? "warn" : "bad";
    const y0 = 62 + f.shelf * 89;
    const x = 36 + Math.min.apply(null, f.slot) * 41 - 4, x2 = 36 + Math.max.apply(null, f.slot) * 41 + 34;
    s += '<rect x="' + x + '" y="' + (y0 + 3) + '" width="' + (x2 - x) + '" height="80" rx="4" class="box ' + cls + (opt.sel === f.id ? " sel" : "") + '"/>';
    const lx = Math.min(x + 3, 230);
    s += '<rect x="' + (lx - 2) + '" y="' + (y0 - 8) + '" width="54" height="15" rx="3" fill="var(--surface)"/>';
    s += '<text x="' + (lx + 2) + '" y="' + (y0 + 3) + '" class="boxlbl ' + cls + '">' + d(f.conf.toFixed(2)) + "</text>";
  });
  s += '<rect x="200" y="426" width="80" height="20" rx="3" fill="#fff" stroke="#999"/>';
  s += '<text x="240" y="440" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#111">' + esc(shop.fridge) + "</text>";
  s += '<rect x="20" y="430" width="40" height="12" rx="6" fill="var(--line)"/>';
  return s + "</svg>";
}

function lineChart(vals) {
  const W = 600, H = 210, pl = 44, pr = 56, pt = 18, pb = 30, lo = 0.5, hi = 1;
  const X = i => pl + i * (W - pl - pr) / (vals.length - 1);
  const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("trend")) + '">';
  [0.5, 0.6, 0.7, 0.8, 0.9, 1].forEach(g => {
    s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(g) + '" y2="' + Y(g) + '"/>';
    s += '<text class="lbl" x="' + (pl - 8) + '" y="' + (Y(g) + 4) + '" text-anchor="end">' + d(Math.round(g * 100)) + "%</text>";
  });
  vals.forEach((v, i) => { s += '<text class="lbl" x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(t("week")) + " " + d(36 + i) + "</text>"; });
  const pts = vals.map((v, i) => X(i) + "," + Y(v)).join(" ");
  s += '<polygon class="area" points="' + X(0) + "," + Y(lo) + " " + pts + " " + X(vals.length - 1) + "," + Y(lo) + '"/>';
  s += '<polyline class="line" points="' + pts + '"/>';
  const li = vals.length - 1;
  s += '<circle class="dot" cx="' + X(li) + '" cy="' + Y(vals[li]) + '" r="5"/>';
  s += '<text class="val" x="' + (X(li) + 10) + '" y="' + (Y(vals[li]) + 4) + '">' + pct(vals[li]) + "</text>";
  return s + "</svg>";
}

function auditView() {
  const co = curCo(); const s = data(co).shops.find(x => x.id === S.shop);
  if (!s) { S.shop = null; return VIEWS.shops(); }
  const frames = FRAMES.slice(0, s.integ.coverage);
  const fail = integrityFail(s);
  const strip = '<div class="framestrip" role="group" aria-label="' + t("frames") + '">' + frames.map((fr, i) => '<button data-act="frame" data-v="' + i + '" aria-pressed="' + (S.frame === i) + '">' + d(fr.t) + "</button>").join("") + "</div>";
  const placementOk = !s.f.some(f => f.type === "placement");
  const compOk = !s.f.some(f => f.type === "competitor");
  let fl = "";
  s.f.forEach(f => {
    const st = fStatus(s, f);
    const cls = f.type === "price" ? (st === "review" ? "warn" : "") : st === "overturned" ? "" : st === "review" ? "warn" : "bad";
    const decided = S.decisions[s.id + ":" + f.id];
    fl += '<div class="finding ' + cls + (S.sel === f.id ? " selected" : "") + '"><div class="stripe"></div><div><div class="t" data-act="self" data-f="' + f.id + '">' + esc(fTitle(f)) + "</div>" +
      '<div class="meta">' + (f.shelf !== null ? "<span>" + shelfLabel(f.shelf) + '</span><span class="mono">' + d(fTime(f)) + "</span>" : "") + '<span class="mono">' + t("conf") + " " + d(f.conf.toFixed(2)) + "</span>" + stChip(st, f.type) + "</div>" +
      (fail ? "" : '<div class="acts">' + (decided ? '<button class="btn" data-act="dec" data-v="' + s.id + '" data-f="' + f.id + '" data-d="">' + t("undo") + "</button>" :
        '<button class="btn danger" data-act="dec" data-v="' + s.id + '" data-f="' + f.id + '" data-d="confirmed">' + t("confirm") + '</button><button class="btn" data-act="dec" data-v="' + s.id + '" data-f="' + f.id + '" data-d="overturned">' + t("overturn") + "</button>") + "</div>") +
      "</div></div>";
  });
  if (compOk) fl += '<div class="finding ok"><div class="stripe"></div><div><div class="t">' + t("f_clean", { co: esc(coName(co)) }) + "</div></div></div>";
  if (placementOk) fl += '<div class="finding ok"><div class="stripe"></div><div><div class="t">' + t("f_okPlacement", { b: esc(co.brands[0]) }) + '</div><div class="meta"><span>' + shelfLabel(0) + "</span></div></div></div>";
  const ck = (ok, txt, sub, plan) => '<div class="check ' + (plan ? "plan" : ok ? "ok" : "bad") + '"><span class="ic">' + (plan ? "○" : ok ? "✓" : "✕") + "</span><span>" + txt + (sub ? '<span class="mono">' + sub + "</span>" : "") + "</span></div>";
  const checks = ck(true, t("i_hash"), s.sha) +
    ck(s.integ.reused === null, s.integ.reused === null ? t("i_new") : t("i_reused", { d: when(s.integ.reused, "").replace(/, $/, "") })) +
    ck(s.integ.sticker, t("i_sticker", { id: s.fridge })) +
    ck(s.integ.coverage === 4, t("i_cov", { a: d(s.integ.coverage), b: d(4) })) +
    ck(true, t("i_date")) + ck(false, t("i_gps"), "", true);
  const sug = suggest(s); const fin = finalRec(s);
  const decide = ["pay", "hold", "reaudit"].map(r => '<button class="btn" data-act="final" data-v="' + s.id + '" data-d="' + r + '" aria-pressed="' + (S.finals[s.id] === r) + '">' + t(r) + "</button>").join("");
  return '<div><button class="btn ghost" data-act="backshop">← ' + t("back") + '</button></div>' +
    '<div class="pagehead"><div><h1>' + esc(L(s)) + '</h1><p>' + esc(L(s, "a")) + ' · <span class="mono">' + s.fridge + "</span> · " + when(s.day, s.hm) + " · " + esc(L(REPS[s.rep])) + '</p></div><button class="btn" data-act="json" data-v="' + s.id + '">' + t("exportJson") + "</button></div>" +
    (fail ? '<div class="result bad"><span class="big">' + t("integrityFail") + "</span><span>" + t("integrityFailD") + "</span></div>" : "") +
    '<div class="grid-ev"><section class="panel"><header><h2>' + t("evidence") + '</h2><span class="small muted mono">' + d(frames.length) + " " + t("frames") + "</span></header>" + fridgeSVG(s, { frame: S.frame, sel: S.sel }) + strip + "</section>" +
    '<section class="panel"><header><h2>' + t("findings") + "</h2></header>" + fl + "</section></div>" +
    '<section class="panel"><header><h2>' + t("integrity") + "</h2></header><div class=\"checks\">" + checks + "</div></section>" +
    '<section class="panel stampwrap"><div><div class="eyebrow">' + t("aiSuggests") + '</div><div style="margin-top:10px"><span class="stamp ' + sug + '">' + t(sug) + '</span></div></div><div><div class="eyebrow" style="margin-bottom:8px">' + t("decision") + '</div><div class="decide">' + decide + "</div></div></section>";
}

/* ---------- events ---------- */
function go(view) { S.view = view; S.shop = null; S.sel = null; render(); const a = document.getElementById("app"); if (a) a.scrollTop = 0; }
let timer = null;
function runVisit() {
  const v = S.visit; v.stage = 0; render();
  clearInterval(timer);
  timer = setInterval(() => {
    v.stage++;
    if (v.stage >= 5) {
      clearInterval(timer);
      const blur = /blur/i.test(v.file || "");
      S.myExtra.unshift({ shop: v.shop, blur });
      const sh = data(curCo()).shops.find(s => s.id === v.shop);
      logIt("logVisit", { u: REPS[ME.merch].en, s: sh.en });
    }
    if (S.view === "newVisit") render();
  }, 650);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "mclose") { if (e.target === el || el.dataset.x) document.getElementById("modal").innerHTML = ""; return; }
  if (a === "mcopy") {
    const txt = document.getElementById("mpre").textContent;
    const done = () => { el.textContent = t("copied"); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mpre")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
    return;
  }
  if (a === "device") { S.device = v; store.set("device", v); render(); return; }
  if (a === "lang") { S.lang = v; store.set("lang", v); render(); return; }
  if (a === "theme") { if (v === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); renderDemo(); return; }
  if (a === "login") { S.role = v; if (v === "merch") S.co = "coke"; go(NAV[v][0][0]); return; }
  if (a === "logout") { S.role = null; S.view = ""; S.shop = null; render(); return; }
  if (a === "nav") { go(v); return; }
  if (a === "shop") { S.view = "shops"; S.shop = v; S.frame = 0; S.sel = null; render(); document.getElementById("app").scrollTop = 0; return; }
  if (a === "openf") {
    const s = data(curCo()).shops.find(x => x.id === v); const f = s.f.find(x => x.id === el.dataset.f);
    S.view = "shops"; S.shop = v; S.sel = f.id;
    const fi = FRAMES.findIndex(x => x.shelf === f.shelf); S.frame = fi >= 0 ? fi : 0; render(); return;
  }
  if (a === "backshop") { S.shop = null; S.sel = null; render(); return; }
  if (a === "frame") { S.frame = +v; render(); return; }
  if (a === "self") {
    const s = data(curCo()).shops.find(x => x.id === S.shop); const f = s.f.find(x => x.id === el.dataset.f);
    S.sel = f.id; const fi = FRAMES.findIndex(x => x.shelf === f.shelf); if (fi >= 0) S.frame = fi; render(); return;
  }
  if (a === "dec") {
    const key = v + ":" + el.dataset.f; const s = data(curCo()).shops.find(x => x.id === v); const f = s.f.find(x => x.id === el.dataset.f);
    if (el.dataset.d) { S.decisions[key] = el.dataset.d; logIt(el.dataset.d === "confirmed" ? "logConfirm" : "logOver", { u: ME.auditor, f: TX.en["f_" + f.type].replace("{b}", f.brand || "").replace("{n}", f.n || ""), s: s.en }); }
    else delete S.decisions[key];
    render(); return;
  }
  if (a === "final") { const s = data(curCo()).shops.find(x => x.id === v); S.finals[v] = S.finals[v] === el.dataset.d ? undefined : el.dataset.d; if (!S.finals[v]) delete S.finals[v]; else logIt("logDecide", { u: ME.auditor, s: s.en, d: TX.en[el.dataset.d] }); render(); return; }
  if (a === "json") { const s = data(curCo()).shops.find(x => x.id === v); openModal(t("exportJson") + " · " + s.en, reportJSON(s)); return; }
  if (a === "startv") { S.visit = { shop: v, file: null, ck: [false, false, false], stage: -1 }; go("newVisit"); return; }
  if (a === "vsample") { S.visit.file = "fridge_01.mp4 · 6.4 s · 576×1024"; render(); return; }
  if (a === "vsubmit") { runVisit(); return; }
  if (a === "newv") { S.visit = null; render(); return; }
});
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "co") { S.co = el.value; S.shop = null; S.sel = null; render(); return; }
  if (a === "vshop") { S.visit.shop = el.value; render(); return; }
  if (a === "vfile") { const f = el.files && el.files[0]; if (f) { S.visit.file = f.name + " · " + (f.size / 1048576).toFixed(1) + " MB"; render(); } return; }
  if (a === "vck") { S.visit.ck[+el.dataset.v] = el.checked; render(); return; }
  if (a === "sv") { S.showVerdict = el.checked; render(); return; }
  if (a === "fps") { S.fps = +el.value; return; }
  if (a === "thr") { logIt("logThr", { v: S.threshold.toFixed(2) }); return; }
});

  const form = e.target.dataset.form;
  if (form === "co") {
    const name = document.getElementById("nCo").value.trim(); const brands = document.getElementById("nBr").value.split(",").map(x => x.trim()).filter(Boolean);

    const id = "c" + Date.now();
    brands.forEach(b => { if (!BRAND[b]) BRAND[b] = { c: "#5B6B9E", owner: id }; });
    while (brands.length < 3) brands.push(brands[brands.length - 1]);
    S.companies.push({ id, name: { en: name, bn: name }, prefix: name.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "XX", brands, rivals: ["Coca-Cola", "Pepsi"], plan: "Trial", fee: 1000 });
    logIt("logCo", { c: name }); render();
  }
  if (form === "user") {
    const name = document.getElementById("nUn").value.trim(); if (!name) return;
    S.users.push({ name, role: document.getElementById("nUr").value, co: document.getElementById("nUc").value });
    logIt("logUser", { c: name }); render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("modal").innerHTML = "";
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.click, .finding .t[data-act]")) { e.preventDefault(); e.target.click(); }
});

const h = (location.hash || "").replace("#", "");
if (h === "merchandiser") S.role = "merch"; else if (h === "auditor") S.role = "auditor"; else if (h === "admin") S.role = "admin";
if (S.role) S.view = NAV[S.role][0][0];
render();
})();
</script>
